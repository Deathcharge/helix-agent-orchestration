name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Security lint shipped modules
        run: python -m bandit -q src/helix_orchestration/__init__.py src/helix_orchestration/actions.py src/helix_orchestration/cli.py src/helix_orchestration/runtime.py src/helix_orchestration/spec.py

      - name: Build distributions
        run: python -m build

      - name: Verify wheel boundary
        run: python -c "import pathlib,zipfile; p=next(pathlib.Path('dist').glob('*.whl')); n=zipfile.ZipFile(p).namelist(); assert 'helix_orchestration/runtime.py' in n; assert not any('/agents/' in x or '/coordination/' in x for x in n)"

      - name: Install and smoke-test wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl && python -c "import importlib.metadata as m, helix_orchestration as h; assert h.__version__ == m.version('helix-orchestration') == '0.1.0'" && helix-orchestration --version
