name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Security lint shipped modules
        run: python -m bandit -q -r src

      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Test distributed source against the installed wheel
        run: python scripts/verify_distributions.py dist

      - name: Verify wheel boundary
        run: python -c "import pathlib,zipfile; p=next(pathlib.Path('dist').glob('*.whl')); n=zipfile.ZipFile(p).namelist(); assert 'samsarix_orchestration/checkpoints.py' in n; assert 'samsarix_orchestration/events.py' in n; assert 'samsarix_orchestration/planning.py' in n; assert 'samsarix_orchestration/runtime.py' in n; assert 'samsarix_orchestration/sqlite_store.py' in n; assert 'samsarix_orchestration/subprocess_actions.py' in n; assert 'helix_orchestration/checkpoints.py' in n; assert 'helix_orchestration/events.py' in n; assert 'helix_orchestration/planning.py' in n; assert 'helix_orchestration/sqlite_store.py' in n; assert 'helix_orchestration/subprocess_actions.py' in n; assert not any('/agents/' in x or '/coordination/' in x or '/plugins/' in x for x in n)"

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import importlib.metadata as m, samsarix_orchestration as s, helix_orchestration as h; assert s.__version__ == h.__version__ == m.version('samsarix-orchestration') == '0.1.0'"
          samsarix-orchestration --version
          helix-orchestration --version
          verify_dir="$(mktemp -d)"
          samsarix-orchestration init "$verify_dir/approval.json" --approval
          samsarix-orchestration plan "$verify_dir/approval.json" --format json > "$verify_dir/plan.json"
          python -c "import json,sys; p=json.load(open(sys.argv[1])); assert p['schema_version'] == 2; assert p['approval_steps'] == ['publish']; assert p['wave_count'] == 2; assert len(p['workflow_digest']) == 64" "$verify_dir/plan.json"
          samsarix-orchestration plan "$verify_dir/approval.json" --format mermaid | grep -q "class n1 approval"
          set +e
          samsarix-orchestration run "$verify_dir/approval.json" --checkpoint-db "$verify_dir/runs.db" --run-id wheel-approval > "$verify_dir/paused.json"
          paused_status=$?
          set -e
          test "$paused_status" -eq 3
          request_id="$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['approvals'][0]['request_id'])" "$verify_dir/paused.json")"
          samsarix-orchestration run "$verify_dir/approval.json" --checkpoint-db "$verify_dir/runs.db" --run-id wheel-approval --resume --approve "$request_id" > "$verify_dir/completed.json"
          python -c "import json,sys; assert json.load(open(sys.argv[1]))['status'] == 'succeeded'" "$verify_dir/completed.json"
          samsarix-orchestration init "$verify_dir/saga.json" --saga
          set +e
          samsarix-orchestration run "$verify_dir/saga.json" --checkpoint-db "$verify_dir/runs.db" --run-id wheel-saga > "$verify_dir/saga-result.json"
          saga_status=$?
          set -e
          test "$saga_status" -eq 1
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['status'] == 'failed'; assert r['compensation_status'] == 'succeeded'; assert len(r['compensations']) == 2" "$verify_dir/saga-result.json"
          samsarix-orchestration runs show "$verify_dir/runs.db" wheel-saga > "$verify_dir/saga-checkpoint.json"
          python -c "import json,sys; c=json.load(open(sys.argv[1])); assert c['phase'] == 'complete'; assert c['successful_compensations'] == 2; assert all('output' not in x for x in c['compensations'])" "$verify_dir/saga-checkpoint.json"
          python examples/subprocess_pipeline.py > "$verify_dir/subprocess-result.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['status'] == 'succeeded'; assert r['steps'][1]['output']['summary'] == 'validated 5 words'" "$verify_dir/subprocess-result.json"
