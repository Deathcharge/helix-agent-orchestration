[build-system]
requires = ["setuptools>=77,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-orchestration"
version = "0.1.0"
description = "Bounded, provider-neutral workflow orchestration for trusted Python callables"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md"]
authors = [{name = "Samsarix LLC", email = "contact@samsarix.com"}]
maintainers = [{name = "Samsarix Support", email = "support@samsarix.com"}]
keywords = ["agents", "asyncio", "orchestration", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "build>=1.3,<2",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
    "twine>=6.2,<7",
]

[project.scripts]
samsarix-orchestration = "samsarix_orchestration.cli:main"
helix-orchestration = "samsarix_orchestration.cli:legacy_main"

[project.urls]
Homepage = "https://github.com/Deathcharge/samsarix-agent-orchestration"
Repository = "https://github.com/Deathcharge/samsarix-agent-orchestration.git"
Issues = "https://github.com/Deathcharge/samsarix-agent-orchestration/issues"
Changelog = "https://github.com/Deathcharge/samsarix-agent-orchestration/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Deathcharge/samsarix-agent-orchestration#readme"
Security = "https://github.com/Deathcharge/samsarix-agent-orchestration/security/policy"
Support = "https://github.com/Deathcharge/samsarix-agent-orchestration/blob/main/SUPPORT.md"

[tool.setuptools]
packages = ["samsarix_orchestration", "helix_orchestration"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
samsarix_orchestration = ["py.typed"]
helix_orchestration = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/samsarix_orchestration", "src/helix_orchestration"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=samsarix_orchestration",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "integration: exercises an end-to-end product journey",
]

[tool.coverage.run]
source = ["samsarix_orchestration"]
omit = [
    "src/samsarix_orchestration/__main__.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
