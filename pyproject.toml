[build-system]
requires = ["setuptools>=77,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-orchestration"
version = "0.1.0"
description = "Local-first, provider-neutral workflow orchestration for Python callables"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE", "LICENSE.PROPRIETARY", "LICENSING.md"]
authors = [
    {name = "Samsara Helix"},
    {name = "Andrew John Ward", email = "andrew@helixcollective.ai"},
]
keywords = ["agents", "asyncio", "orchestration", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "build>=1.3,<2",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[project.scripts]
helix-orchestration = "helix_orchestration.cli:main"

[project.urls]
Homepage = "https://github.com/Deathcharge/helix-agent-orchestration"
Repository = "https://github.com/Deathcharge/helix-agent-orchestration.git"
Issues = "https://github.com/Deathcharge/helix-agent-orchestration/issues"
Changelog = "https://github.com/Deathcharge/helix-agent-orchestration/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["helix_orchestration"]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "benchmarks",
    "examples/advanced_configuration.py",
    "examples/advanced_patterns.py",
    "examples/basic_orchestration.py",
    "examples/helix_integration.py",
    "helix_agent_orchestration",
    "src/helix_orchestration/agents",
    "src/helix_orchestration/communication",
    "src/helix_orchestration/config",
    "src/helix_orchestration/coordination",
    "src/helix_orchestration/debugging",
    "src/helix_orchestration/monitoring",
    "src/helix_orchestration/optimization",
    "src/helix_orchestration/plugins",
    "src/helix_orchestration/resilience",
    "src/helix_orchestration/ucf_framework",
    "src/helix_orchestration/workflows",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/helix_orchestration/*.py"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=helix_orchestration",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "integration: exercises an end-to-end product journey",
]

[tool.coverage.run]
source = ["helix_orchestration"]
omit = [
    "src/helix_orchestration/__main__.py",
    "src/helix_orchestration/agents/*",
    "src/helix_orchestration/communication/*",
    "src/helix_orchestration/config/*",
    "src/helix_orchestration/coordination/*",
    "src/helix_orchestration/debugging/*",
    "src/helix_orchestration/monitoring/*",
    "src/helix_orchestration/optimization/*",
    "src/helix_orchestration/plugins/*",
    "src/helix_orchestration/resilience/*",
    "src/helix_orchestration/ucf_framework/*",
    "src/helix_orchestration/workflows/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
